name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Detangle.slnx

      - name: Build
        run: dotnet build Detangle.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Detangle.slnx --configuration Release --no-build

  # The phase 5 budgets — a cold index under five seconds and a query under fifty
  # milliseconds over a 5,000-file vault — are measured on one job rather than on every
  # job of the matrix: generating and indexing that vault takes about a minute and leans
  # on the disk, which is slow and noisy on a shared runner.
  performance:
    name: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Measure
        env:
          DETANGLE_PERF: '1'
        run: >
          dotnet test tests/Detangle.Core.Tests/Detangle.Core.Tests.csproj
          --configuration Release
          --filter-query "/*/*/PerformanceTests/*"
          --output Detailed

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify formatting
        run: dotnet format Detangle.slnx --verify-no-changes --severity warn
