name: Site

# The website, the docs and the WASM demo are one deploy. The docs are published by
# Detangle's own exporter, so the exporter is exercised on every deploy rather than only
# in tests — if it ever drops a link, the site is where it shows up first.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'samples/**'
      - 'src/**'
      - '.github/workflows/site.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Assemble the static pages
        run: |
          mkdir -p public
          cp -r site/. public/
          rm -f public/_headers.bak

      - name: Publish the docs with Detangle itself
        run: |
          dotnet run --project src/Detangle.Desktop/Detangle.Desktop.csproj \
            --configuration Release \
            -- --export-site docs public/docs --title "Detangle Docs"

      - name: Build the WASM demo
        run: |
          dotnet publish src/Detangle.Browser/Detangle.Browser.csproj \
            --configuration Release \
            --output demo-publish

          mkdir -p public/demo
          cp -r demo-publish/wwwroot/. public/demo/

      - name: Bake in the released version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolved at build time rather than by a fetch from the page: the site's own
          # CSP forbids connect-src, and a download button that needs an API call to
          # know what to download would be the one thing on the page that phones home.
          version=$(gh release view --json tagName --jq '.tagName' 2>/dev/null | sed 's/^v//' || true)

          if [ -z "$version" ]; then
            echo "::notice::no published release yet; leaving the placeholder version in place"
            exit 0
          fi

          sed -i "s|<span id=\"version\">[^<]*</span>|<span id=\"version\">${version}</span>|" public/index.html
          sed -i "s|detangle_[0-9][0-9.]*_amd64.deb|detangle_${version}_amd64.deb|" public/index.html

          echo "baked version ${version}"

      - name: Check the demo actually got built
        run: |
          # A deploy that quietly ships an empty iframe is worse than a failed build.
          test -f public/demo/index.html
          test -d public/demo/_framework
          test -f public/docs/link-resolution.html
          test -f public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
