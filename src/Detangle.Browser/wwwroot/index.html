<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Detangle — live demo</title>
  <!-- The site's own mark, one level up. Without it every visit asks for /demo/favicon.ico
       and takes a 404 in the console, which looks like the demo is missing something. -->
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Detangle running in a browser tab, reading a wiki an LLM wrote." />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <noscript>
    The demo needs JavaScript and WebAssembly. Everything it does runs in this tab —
    <a href="../">the desktop app</a> needs neither.
  </noscript>

  <div id="loading" role="status">
    <p class="mark">de<span>tangle</span></p>

    <div class="progress">
      <div class="progress-track">
        <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="Loading Detangle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
      <p class="progress-line">
        <span id="progress-phase">Downloading the runtime</span>
        <span class="progress-percent" id="progress-percent" aria-hidden="true">0%</span>
      </p>
      <p class="progress-detail" id="progress-detail" aria-hidden="true">0 of 0 files</p>
    </div>

    <p class="note">Nothing is fetched after this — check the network tab.</p>
  </div>

  <div id="out"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
